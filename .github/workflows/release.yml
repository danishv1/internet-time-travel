name: Release extension zip

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          zip -r "internet-time-travel-v${VERSION}.zip" manifest.json background.js content-google.js content-youtube.js popup.html popup.js icons
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          FILE="internet-time-travel-v${VERSION}.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "$TAG" --generate-notes
          fi
